server:
  port: 28000
  servlet:
    context-path: /ve
spring:
  application:
    name: service-ve
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://centos.localhost.sucrayon.top:13306/ve?serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
# mybatis日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # xml文件的位置
  mapper-locations: classpath:com/crayon/ve/mapper/xml/*.xml